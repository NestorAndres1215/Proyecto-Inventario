<div class="container">


  <div class="mt-4 mb-4">
    <mat-form-field appearance="outline" class="w-100">
      <mat-icon matPrefix>search</mat-icon>
      <input matInput type="search" placeholder="Buscar por nombre" [(ngModel)]="nombre" (input)="buscarPorNombre()"
        autocomplete="off">
    </mat-form-field>
  </div>

<app-tabla
  [datos]="productos"
  [columnas]="columnas"
  [botonesConfig]="botonesConfig"
  [onVer]="verProducto"
  [onActivar]="activarProducto">
</app-tabla>

  <!-- Paginador -->
  <mat-paginator [length]="productos.length" [pageSize]="pageSize" [pageIndex]="pageIndex" (page)="onPageChange($event)"
    #paginator>
  </mat-paginator>
</div>
